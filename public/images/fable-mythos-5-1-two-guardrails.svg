<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Fable 5.1 and Mythos 5.1 are one model behind two safeguard boundaries</title>
  <desc id="desc">One shared model branches into Fable 5.1 for general availability with stricter safeguards and Mythos 5.1 for vetted cyber and life-science users with more permissive safeguards.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .core { fill: #242424; stroke: #242424; stroke-width: 2; }
      .public { fill: #edf5f0; stroke: #39765f; stroke-width: 2; }
      .trusted { fill: #fff1ed; stroke: #b83b28; stroke-width: 2; }
      .eyebrow { fill: #b83b28; font: 700 17px ui-monospace, SFMono-Regular, monospace; letter-spacing: .09em; }
      .headline { fill: #242424; font: 700 30px ui-sans-serif, system-ui, sans-serif; }
      .coreTitle { fill: #fff; font: 700 28px ui-sans-serif, system-ui, sans-serif; }
      .coreDetail { fill: #d8d5ce; font: 18px ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #242424; font: 700 25px ui-sans-serif, system-ui, sans-serif; }
      .detail { fill: #5d5a54; font: 18px ui-sans-serif, system-ui, sans-serif; }
      .publicTag { fill: #39765f; font: 700 16px ui-monospace, SFMono-Regular, monospace; letter-spacing: .08em; }
      .trustedTag { fill: #b83b28; font: 700 16px ui-monospace, SFMono-Regular, monospace; letter-spacing: .08em; }
      .arrow { fill: none; stroke: #242424; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#242424"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="630" rx="24"/>
  <text class="eyebrow" x="60" y="62">CLAUDE 5.1</text>
  <text class="headline" x="1140" y="64" text-anchor="end">One model. Two trust boundaries.</text>

  <rect class="core" x="390" y="112" width="420" height="150" rx="18"/>
  <text class="coreTitle" x="600" y="169" text-anchor="middle">The same underlying model</text>
  <text class="coreDetail" x="600" y="207" text-anchor="middle">coding · knowledge work · scientific research</text>
  <text class="coreDetail" x="600" y="235" text-anchor="middle">different safeguards, not different intelligence</text>

  <path class="arrow" marker-end="url(#head)" d="M515 262V310H310V348"/>
  <path class="arrow" marker-end="url(#head)" d="M685 262V310H890V348"/>

  <rect class="public" x="60" y="365" width="500" height="190" rx="18"/>
  <text class="publicTag" x="92" y="408">GENERAL AVAILABILITY</text>
  <text class="label" x="92" y="452">Claude Fable 5.1</text>
  <text class="detail" x="92" y="490">Vulnerability discovery allowed</text>
  <text class="detail" x="92" y="520">Higher-risk cyber and biology work restricted</text>

  <rect class="trusted" x="640" y="365" width="500" height="190" rx="18"/>
  <text class="trustedTag" x="672" y="408">VETTED ACCESS</text>
  <text class="label" x="672" y="452">Claude Mythos 5.1</text>
  <text class="detail" x="672" y="490">More permissive cyber and life-science safeguards</text>
  <text class="detail" x="672" y="520">Available through trusted access programs</text>

  <text class="detail" x="60" y="596">The capability is shared. The permission boundary is the product.</text>
</svg>
