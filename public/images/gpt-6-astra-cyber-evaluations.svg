<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6 Astra cybersecurity evaluations against a browser and operating system</title>
  <desc id="desc">Astra built a browser exploit in 29 hours, adapted it to the stable release in another 12 hours, and built an operating-system privilege-escalation exploit in 12 hours.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .card { fill: #fff; stroke: #242424; stroke-width: 2; }
      .danger { fill: #fff1ed; stroke: #b83b28; stroke-width: 2; }
      .eyebrow { fill: #b83b28; font: 700 16px ui-monospace, SFMono-Regular, monospace; letter-spacing: .09em; }
      .headline { fill: #242424; font: 700 28px ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #242424; font: 700 23px ui-sans-serif, system-ui, sans-serif; }
      .detail { fill: #5d5a54; font: 17px ui-sans-serif, system-ui, sans-serif; }
      .number { fill: #b83b28; font: 800 54px ui-sans-serif, system-ui, sans-serif; }
      .line { stroke: #b83b28; stroke-width: 8; stroke-linecap: round; }
      .dot { fill: #b83b28; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="590" rx="24"/>
  <text class="eyebrow" x="60" y="60">CRITICAL CYBER CAPABILITY</text>
  <text class="headline" x="1140" y="62" text-anchor="end">The result came from persistence, not one answer.</text>

  <rect class="danger" x="60" y="108" width="1080" height="110" rx="18"/>
  <text class="number" x="94" y="177">2</text>
  <text class="label" x="148" y="157">previously unknown zero-days</text>
  <text class="detail" x="148" y="188">found and used while evaluating vulnerabilities disclosed after Astra's knowledge cutoff</text>

  <text class="eyebrow" x="60" y="280">BROWSER</text>
  <line class="line" x1="96" y1="333" x2="704" y2="333"/>
  <circle class="dot" cx="96" cy="333" r="13"/>
  <circle class="dot" cx="510" cy="333" r="13"/>
  <circle class="dot" cx="704" cy="333" r="13"/>
  <text class="label" x="96" y="378">Start</text>
  <text class="number" x="438" y="311">29h</text>
  <text class="detail" x="390" y="405">First working chain</text>
  <text class="number" x="650" y="311">+12h</text>
  <text class="detail" x="614" y="405">Stable release</text>

  <rect class="card" x="800" y="264" width="340" height="158" rx="18"/>
  <text class="eyebrow" x="830" y="305">OPERATING SYSTEM</text>
  <text class="number" x="830" y="365">12h</text>
  <text class="detail" x="950" y="348">to local privilege</text>
  <text class="detail" x="950" y="378">escalation on a</text>
  <text class="detail" x="950" y="408">hardened configuration</text>

  <rect class="card" x="60" y="470" width="1080" height="70" rx="16"/>
  <text class="label" x="600" y="513" text-anchor="middle">Search → test → fail → revise → continue until the exploit works</text>
</svg>
