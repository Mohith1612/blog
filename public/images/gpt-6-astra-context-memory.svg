<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How Astra preserves context across long Codex sessions</title>
  <desc id="desc">The previous approach repeatedly compressed full context into summaries. Astra keeps working notes and makes earlier context windows searchable.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .card { fill: #fff; stroke: #242424; stroke-width: 2; }
      .old { fill: #f0eee8; stroke: #817d75; stroke-width: 2; }
      .new { fill: #edf5f0; stroke: #39765f; stroke-width: 2; }
      .notes { fill: #fff1ed; stroke: #b83b28; stroke-width: 2; }
      .eyebrow { fill: #b83b28; font: 700 16px ui-monospace, SFMono-Regular, monospace; letter-spacing: .09em; }
      .headline { fill: #242424; font: 700 28px ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #242424; font: 700 21px ui-sans-serif, system-ui, sans-serif; }
      .detail { fill: #5d5a54; font: 17px ui-sans-serif, system-ui, sans-serif; }
      .inside { fill: #5d5a54; font: 15px ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #5d5a54; font: 15px ui-monospace, SFMono-Regular, monospace; }
      .arrow { fill: none; stroke: #242424; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .search { fill: none; stroke: #39765f; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 10; }
    </style>
    <marker id="head" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#242424"/>
    </marker>
    <marker id="greenHead" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#39765f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="eyebrow" x="60" y="58">LONG-RUNNING CODEX WORK</text>
  <text class="headline" x="1140" y="60" text-anchor="end">From lossy summaries to retrievable history</text>

  <text class="label" x="60" y="122">Before</text>
  <rect class="old" x="60" y="150" width="240" height="104" rx="14"/>
  <text class="small" x="180" y="187" text-anchor="middle">FULL CONTEXT</text>
  <text class="inside" x="180" y="215" text-anchor="middle">requirements · tests</text>
  <text class="inside" x="180" y="237" text-anchor="middle">failed fixes</text>
  <path class="arrow" marker-end="url(#head)" d="M300 202H334"/>
  <rect class="old" x="350" y="150" width="240" height="104" rx="14"/>
  <text class="small" x="470" y="190" text-anchor="middle">SUMMARY</text>
  <text class="inside" x="470" y="222" text-anchor="middle">some detail disappears</text>
  <path class="arrow" marker-end="url(#head)" d="M590 202H624"/>
  <rect class="old" x="640" y="150" width="240" height="104" rx="14"/>
  <text class="small" x="760" y="190" text-anchor="middle">NEW CONTEXT</text>
  <text class="inside" x="760" y="222" text-anchor="middle">work continues</text>
  <path class="arrow" marker-end="url(#head)" d="M880 202H914"/>
  <rect class="old" x="930" y="150" width="210" height="104" rx="14"/>
  <text class="small" x="1035" y="190" text-anchor="middle">SUMMARY AGAIN</text>
  <text class="inside" x="1035" y="222" text-anchor="middle">the loss compounds</text>

  <text class="label" x="60" y="316">With Astra</text>
  <rect class="new" x="60" y="365" width="220" height="100" rx="14"/>
  <text class="small" x="170" y="405" text-anchor="middle">WINDOW 1</text>
  <text class="inside" x="170" y="435" text-anchor="middle">searchable history</text>
  <rect class="new" x="320" y="365" width="220" height="100" rx="14"/>
  <text class="small" x="430" y="405" text-anchor="middle">WINDOW 2</text>
  <text class="inside" x="430" y="435" text-anchor="middle">searchable history</text>
  <rect class="new" x="580" y="365" width="220" height="100" rx="14"/>
  <text class="small" x="690" y="405" text-anchor="middle">WINDOW 3</text>
  <text class="inside" x="690" y="435" text-anchor="middle">current work</text>
  <rect class="notes" x="860" y="340" width="280" height="150" rx="16"/>
  <text class="eyebrow" x="890" y="379">WORKING NOTES</text>
  <text class="inside" x="890" y="414">Requirements worth keeping</text>
  <text class="inside" x="890" y="441">Failed fixes and test results</text>
  <text class="inside" x="890" y="468">Pointers back into history</text>

  <path class="search" marker-end="url(#greenHead)" d="M960 340C900 305 770 314 710 365"/>
  <path class="search" marker-end="url(#greenHead)" d="M900 340C720 286 360 292 240 365"/>
  <text class="detail" x="60" y="530">A larger window postpones forgetting. Retrieval changes what happens after it.</text>
</svg>
